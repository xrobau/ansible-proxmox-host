---
- name: Force apt to only use ipv4
  copy:
    src: 10-apt-use-ipv4
    dest: /etc/apt/apt.conf.d/

- name: Select distro
  set_fact:
    distro: "{{ forcedistro | default(ansible_facts.distribution_release) }}"

# Disabled, as Trixie has it already set up correctly
- name: Disable proxmox enterprise
  template:
    src: pve-enterprise.list
    dest: /etc/apt/sources.list.d/pve-enterprise.list
  notify:
    - apt-update
  when: false

- name: Disable proxmox ceph enterprise
  template:
    src: ceph.list
    dest: /etc/apt/sources.list.d/ceph.list
  notify:
    - apt-update
  when: false

- name: Update sources.list
  template:
    src: sources.list
    dest: /etc/apt/sources.list
  notify:
    - apt-update
  when: false

- meta: flush_handlers

